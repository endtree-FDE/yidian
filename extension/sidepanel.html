<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>一点 · 侧边栏</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <p class="eyebrow">一点｜打开时的网页</p>
        <a class="library-link" href="library.html" target="_blank" rel="noopener">全部收藏</a>
      </header>

      <section class="document-card">
        <p id="source" class="source"></p>
        <h1 id="document-title">正在连接一点…</h1>
        <p id="status-copy" class="status-copy">这里会显示当前网页的收藏状态和下次回看时间。</p>
        <p id="excerpt" class="excerpt" hidden></p>
        <p id="next-review" class="next-review"></p>

        <div class="actions">
          <button id="primary-action" type="button" hidden></button>
          <div id="review-choices" class="review-choices" hidden>
            <button id="review-later" class="secondary" type="button">稍后再看</button>
            <button id="review-retire" class="secondary" type="button">不再需要</button>
          </div>
          <button id="retry" class="secondary" type="button" hidden>重新连接</button>
          <button id="open-extensions" class="secondary" type="button" hidden>打开扩展管理页</button>
        </div>

        <details id="manage" hidden>
          <summary>管理这条记录</summary>
          <label for="url-input">原网页链接</label>
          <input id="url-input" type="url" inputmode="url">
          <div class="manage-actions">
            <button id="save-url" type="button">保存链接</button>
            <button id="delete-record" class="danger" type="button">删除记录</button>
          </div>
        </details>
      </section>

      <section id="progress-card" class="progress-card" aria-label="这页的回看进度" hidden>
        <div class="progress-heading"><span>这页的回看进度</span><strong id="progress-text">0/4</strong></div>
        <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
        <p class="progress-steps">收下 1 次 · 第 2、7、30 天各回看 1 次</p>
      </section>

      <p id="live-status" role="status" aria-live="polite"></p>

      <footer>
        <label>
          <input id="reduced-motion" type="checkbox">
          减少动态效果
        </label>
        <p class="local-note">收藏只保存在这台电脑。工具栏图标用于在网页上唤出一点。</p>
      </footer>
    </main>
    <script type="module" src="sidepanel.mjs"></script>
  </body>
</html>

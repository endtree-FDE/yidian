name: security

# 密钥闸门：任何分支 push 都扫全历史（PR 分支推送同样触发），每周一北京时间凌晨复查。
# 固定 gitleaks 8.28.0 + sha256 校验（与 mimi-agent 的 secret scan 同一做法）；
# --redact 保证日志不出现密钥明文。发现疑似密钥 → job 红 → 合并被拦，立案由人处置。
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 0"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 全历史扫描
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --exit-code 1

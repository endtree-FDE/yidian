name: 功能建议
description: 说说你希望一点怎样帮助工作或学习
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        比功能名称更重要的是使用场景。请先告诉我们，你在什么时候遇到了什么困难。
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你当时在工作或学习中做什么？
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 现在的困难
      description: 目前为什么难以继续，或者重要内容为什么容易失踪？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
      description: 不必设计完整功能，只说你希望事情最后变成什么样。
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 现在怎样解决
      description: 如果已有临时办法，也请告诉我们。

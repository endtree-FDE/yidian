<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>一点 · 回看统计</title>
  <link rel="stylesheet" href="stats.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">一点｜只是数一数，不催你</p>
      <h1>回看统计</h1>
      <p class="intro">这里只记录已经发生的事。你什么时候来，一点都高兴。</p>
    </header>

    <section class="facts" aria-label="已经发生的事">
      <div><strong id="total">0</strong><span>份收藏</span></div>
      <div><strong id="completed">0</strong><span>次回看计划完成</span></div>
      <div><strong id="encounters">0</strong><span>次相见</span></div>
    </section>

    <section class="domains" aria-label="最常收藏的域名">
      <h2>最常收下的地方</h2>
      <p id="domains-empty" class="empty" hidden>还没有收藏。去任意普通网页点击“一点”图标，再点“收下这条”。</p>
      <ol id="domains"></ol>
    </section>

    <p class="footnote">统计只在本地计算，不上传、不比较、不打扰。</p>
    <p><a class="back" href="library.html">回到我的收藏</a></p>
  </main>
  <script src="stats.js" type="module"></script>
</body>
</html>
